<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Pet Health Care</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span>+</span>Pet health care</a>
      <button id="logout" type="button">Log out <b>↗</b></button>
    </header>
    <div class="dashboard-layout">
      <aside class="side-nav" aria-label="Dashboard navigation">
        <small>YOUR CARE SPACE</small>
        <nav>
          <a
            class="active"
            href="#dashboard"
            data-section="dashboard"
            aria-current="page"
          >
            <span aria-hidden="true">▦</span>Dashboard
          </a>
          <a href="#add-pet" data-section="add-pet"
            ><span aria-hidden="true">＋</span>Add Pet</a
          >
          <a href="#profile" data-section="profile"
            ><span aria-hidden="true">○</span>Profile</a
          >
        </nav>
      </aside>
      <section class="dashboard-view">
        <article
          class="content-section"
          data-content="dashboard"
          aria-labelledby="dashboard-title"
        >
          <small>DASHBOARD</small>
          <h1 id="dashboard-title">Your care space</h1>
          <p>Keep your pet's health details close and easy to manage.</p>
        </article>
        <article
          class="content-section"
          data-content="add-pet"
          aria-labelledby="add-pet-title"
          hidden
        >
          <small>NEW PET</small>
          <h1 id="add-pet-title">Add a pet</h1>
          <p>Start a care profile for a new member of your family.</p>
          <form class="pet-form">
            <label for="pet-name">Pet name</label>
            <input id="pet-name" type="text" placeholder="e.g. Luna" />
            <label for="pet-type">Pet type</label>
            <select id="pet-type">
              <option>Dog</option>
              <option>Cat</option>
              <option>Bird</option>
              <option>Other</option>
            </select>
            <button type="button">Save pet <b>→</b></button>
          </form>
        </article>
        <article
          class="content-section"
          data-content="profile"
          aria-labelledby="profile-title"
          hidden
        >
          <small>YOUR ACCOUNT</small>
          <h1 id="profile-title">Profile</h1>
          <div class="profile-details">
            <span>Name</span><strong id="profile-name">Pet parent</strong>
            <span>Email</span><strong id="profile-email">Not available</strong>
          </div>
        </article>
      </section>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
