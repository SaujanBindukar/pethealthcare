<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Pet Health Care</title>
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="../home/index.html"
        ><span>+</span>Pet health care</a
      >
      <nav>
        <a href="../home/index.html#home">Home</a
        ><a href="../home/index.html#care">Care</a
        ><a href="../home/index.html#breeds">Dogs Breed</a
        ><a href="../home/index.html#services">Services</a
        ><a class="active" href="account.html">Account ↗</a>
      </nav>
    </header>
    <main>
      <section class="intro">
        <small>YOUR CARE SPACE</small>
        <h1>Good care<br /><i>starts with hello.</i></h1>
        <p>
          Keep your pet's details close and make every visit feel a little
          easier.
        </p>
      </section>
      <section class="panel">
        <div class="tabs">
          <button class="active" data-mode="login">Log in</button
          ><button data-mode="register">Register</button>
        </div>
        <form id="account-form">
          <label class="name-field" for="name" hidden>Name</label
          ><input
            class="name-field"
            id="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            hidden
          />
          <label for="email">Email address</label
          ><input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          /><label for="password">Password</label
          ><input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button class="submit" type="submit">Log in <b>→</b></button>
          <p class="form-status" role="alert" aria-live="polite"></p>
        </form>
        <p class="footnote">
          New here? <a href="#" data-switch> Create an account</a>
        </p>
      </section>
    </main>
    <script src="account.js"></script>
  </body>
</html>
